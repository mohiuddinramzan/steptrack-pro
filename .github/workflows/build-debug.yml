name: Build StepTrack Pro Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 0.2.0 (leave empty to use gradle.properties)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -o pipefail
          ARGS="-PappVersionCode=${GITHUB_RUN_NUMBER}"
          if [ -n "$INPUT_VERSION_NAME" ]; then
            if [[ ! "$INPUT_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version name: $INPUT_VERSION_NAME (expected x.y.z)"
              exit 1
            fi
            ARGS="$ARGS -PappVersionName=${INPUT_VERSION_NAME}"
          fi
          gradle assembleDebug --stacktrace $ARGS 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StepTrackPro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report build errors
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo '```'
            grep -E "error:|^e: |FAILED|What went wrong|Execution failed" -A4 build.log | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.run_number }}
          path: |
            build.log
            app/build/reports/
          if-no-files-found: warn
