name: Release signed APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "Minor and patch numbers must be below 100"
            exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --stacktrace \
            -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" 2>&1 | tee build.log

      - name: Verify signature and prepare files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found. The signing config may be missing."
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          mkdir -p dist
          cp "$APK" "dist/StepTrackPro-$TAG.apk"
          (cd dist && sha256sum "StepTrackPro-$TAG.apk" > "StepTrackPro-$TAG.apk.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PRE=""
          if [[ "$VERSION" == 0.* ]]; then
            PRE="--prerelease"
          fi
          {
            echo "## StepTrack Pro $TAG (beta)"
            echo ""
            echo "Offline step counter. No internet permission, no data leaves your phone."
            echo ""
            echo "### Install"
            echo "1. Download the APK below and open it on your phone."
            echo "2. Allow installing from this source if Android asks."
            echo "3. If you installed an earlier test build, uninstall it first (different signature)."
            echo ""
            echo "### Notes"
            echo "- Beta: tested on one phone so far."
            echo "- On some phones background tracking needs battery settings changed (see the in-app Battery guidance)."
            echo ""
            echo "### Verify"
            echo "SHA-256 of the APK is in the .sha256 file. Signing certificate:"
            echo '```'
            grep "SHA-256" cert.txt || true
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* --title "StepTrack Pro $TAG" --notes-file notes.md $PRE

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: |
            build.log
            app/build/reports/
          if-no-files-found: warn
